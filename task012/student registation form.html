<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>

<h1>Online Course Registration Form</h1>

<form action="main.html" method="post" target="_blank">

<label for="name">Student Name:</label>
<input type="text" id="name" name="studentname"
placeholder="Enter your name" required>
<br>

<label for="email">Email Address:</label>
<input type="email" id="email" name="email"
placeholder="Enter your email" required>
<br>

        
<label for="mobile">Mobile Number:</label>
<input type="tel" id="mobile" name="mobile"
placeholder="Enter mobile number" required>
<br>

<label for="age">Age:</label>
<input type="number" id="age" name="age"
placeholder="Enter your age">
<br>

        
<label for="password">Password:</label>
<input type="password" id="password" name="password"
placeholder="Enter password" required>
<br>
<label>Gender:</label>

<input type="radio" id="male" name="gender"
value="Male" required>
<label for="male">Male</label>

<input type="radio" id="female" name="gender"
value="Female">
<label for="female">Female</label>

<input type="radio" id="other" name="gender"
value="Other">
<label for="other">Other</label>
<br>

<label for="course">Select Course:</label>
<select id="course" name="course" required>
<option value="">--Select Course--</option>
<option value="Web Developer">Web Developer</option>
<option value="Python Programming">Python Programming</option>
<option value="Data Analytics">Data Analytics</option>
<option value="Digital Marketing">Digital Marketing</option>
</select>
<br>
<input type="hidden" name="formname"
value="Online Course Registration">

<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob">
<br>

<label for="time">Preferred Class Time:</label>
<input type="time" id="time" name="classtime">
<br>

<label for="address">Address / Additional Information:</label>
<br>
<textarea id="address" name="address"
rows="4" cols="35"
placeholder="Enter your address "></textarea>
<br>

<label for="document">Upload Document or Photograph:</label>
<input type="file" id="document" name="document">
<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
