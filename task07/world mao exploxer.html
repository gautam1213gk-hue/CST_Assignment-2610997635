<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Explorer</title>
    
</head>
<body>
    
<h1>World Map Explorer</h1>
<p>Click on different regions of the map to explore various countries in a new tab!</p>

<div class="map-container">
        
<img src="world map exploxer.jpg" alt="World Map" usemap="#worldmap">

       
<map name="worldmap">
            
<area shape="circle" coords="150,120,40" href="https://en.wikipedia.org/wiki/Greenland" target="_blank" alt="Greenland (Circular Region)">

            
<area shape="rect" coords="250,200,350,300" href="https://en.wikipedia.org/wiki/United_States" target="_blank" alt="United States (Rectangular Region)">

           
<area shape="poly" coords="450,150,520,130,550,220,460,250" href="https://en.wikipedia.org/wiki/Brazil" target="_blank" alt="Brazil (Polygon Region)">

            
<area shape="default" href="https://en.wikipedia.org/wiki/World_map" target="_blank" alt="Default Global Overview">
</map>
</div>

</body>
</html>
